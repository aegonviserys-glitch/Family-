<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Buku Keluarga</title>
<meta name="theme-color" content="#0a0c1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" id="favicon" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0c1b;--ink2:#141833;--ink3:#1e2450;--line:rgba(160,180,255,.13);
    --kia:#ff5f8d;--jade:#39e6b0;--gold:#ffc247;--iris:#7c8cff;--mist:#98a0d4;--paper:#eef1ff;
    --glow:0 0 24px rgba(255,95,141,.35);
    --px:50%;--py:30%;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--paper);font-family:"Public Sans",system-ui,sans-serif;
    font-size:15px;line-height:1.5;padding-bottom:104px;overflow-x:hidden;-webkit-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  /* ambient scene */
  body::before{content:"";position:fixed;inset:-20%;z-index:-2;
    background:
      radial-gradient(600px 380px at calc(var(--px)) calc(var(--py)), rgba(255,95,141,.18), transparent 65%),
      radial-gradient(700px 500px at 90% 105%, rgba(124,140,255,.16), transparent 65%),
      radial-gradient(500px 400px at 5% 60%, rgba(57,230,176,.09), transparent 70%);
    transition:background-position .3s}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(160,180,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(160,180,255,.05) 1px,transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(circle at 50% 22%, #000 0%, transparent 72%);
    -webkit-mask-image:radial-gradient(circle at 50% 22%, #000 0%, transparent 72%)}
  h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.025em;line-height:1.12}
  .mono{font-family:"JetBrains Mono",monospace}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  header{padding:24px 0 12px;display:flex;align-items:flex-start;gap:10px}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mist)}
  header h1{font-size:31px;font-weight:800;margin-top:5px;
    background:linear-gradient(100deg,#fff,#b9c2ff 55%,#ff9ab7);-webkit-background-clip:text;background-clip:text;color:transparent}
  header .sub{color:var(--mist);font-size:13px;margin-top:4px}
  .gear{margin-left:auto;margin-top:6px;background:rgba(160,180,255,.09);border:1px solid var(--line);
    border-radius:13px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:0 0 40px}
  .gear svg{width:19px;height:19px;stroke:var(--mist);fill:none;stroke-width:1.7}

  /* kedalaman statis: tepi bercahaya + kilau yang bergerak sendiri */
  .tilt{position:relative}
  .tilt::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(145deg,rgba(255,95,141,.55),rgba(124,140,255,.35) 42%,transparent 70%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;opacity:.75}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .card,.hero,.stat,.member,.qbtn{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
  .card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}
  @keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
  .hero .sheen{position:absolute;top:0;bottom:0;width:38%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.09),transparent);
    animation:sweep 6.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .flag.now i{animation:pulse 2.2s ease-in-out infinite}
  .card{position:relative;background:linear-gradient(165deg,rgba(30,36,80,.92),rgba(15,18,45,.78));
    border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;overflow:hidden;
    box-shadow:0 18px 40px -28px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06)}
  .card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:20px;
    background:radial-gradient(340px 200px at var(--px) var(--py), rgba(255,255,255,.09), transparent 60%)}
  .sec-title{font-family:"Bricolage Grotesque",sans-serif;font-size:12px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--mist);margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}

  /* hero */
  .hero{position:relative;border-radius:26px;padding:22px 20px 20px;overflow:hidden;
    background:linear-gradient(155deg,#2b1740,#161a3d 52%,#0b0e22);
    border:1px solid rgba(255,95,141,.3);
    box-shadow:0 30px 60px -34px rgba(255,95,141,.5), inset 0 1px 0 rgba(255,255,255,.08)}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(320px 200px at var(--px) var(--py), rgba(255,255,255,.13), transparent 62%)}
  .hero .layer{position:relative;z-index:2}
  .hero .name{font-size:12px;color:var(--kia);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
  .age-big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:42px;line-height:1;margin-top:8px;
    text-shadow:0 6px 22px rgba(255,95,141,.4)}
  .age-big small{font-size:17px;font-weight:600;color:var(--mist);margin-left:3px;text-shadow:none}
  .daycount{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--mist);margin-top:8px;letter-spacing:.04em}
  .daycount b{color:var(--paper)}
  .ribbon{margin-top:20px}
  .ribbon-track{position:relative;height:46px}
  .ribbon-line{position:absolute;top:22px;left:0;right:0;height:3px;background:rgba(152,160,212,.18);border-radius:2px}
  .ribbon-fill{position:absolute;top:22px;left:0;height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--kia),#ffa46b);box-shadow:0 0 14px rgba(255,95,141,.7);
    transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .tick{position:absolute;top:16px;width:1px;height:8px;background:rgba(152,160,212,.3);transform:translateX(-.5px)}
  .flag{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--mist)}
  .flag i{display:block;width:7px;height:7px;border-radius:50%;border:1.5px solid rgba(152,160,212,.5);margin:2px auto 0}
  .flag.done i{background:var(--jade);border-color:var(--jade);box-shadow:0 0 10px rgba(57,230,176,.8)}
  .flag.now i{background:var(--kia);border-color:var(--kia);box-shadow:0 0 0 5px rgba(255,95,141,.18),0 0 14px var(--kia)}
  .flag.now{color:var(--kia)}
  .ribbon-cap{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--mist);margin-top:4px;letter-spacing:.1em}

  /* stat grid */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
  .stat{position:relative;border-radius:16px;padding:12px 11px;border:1px solid var(--line);
    background:linear-gradient(165deg,rgba(30,36,80,.9),rgba(14,17,42,.75));overflow:hidden}
  .stat::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 45%)}
  .stat b{display:block;position:relative;font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:800;line-height:1.1;margin-top:3px}
  .stat span{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
  .stat small{font-size:11px;color:var(--mist)}
  .stat.k b{color:var(--kia)}.stat.j b{color:var(--jade)}.stat.g b{color:var(--gold)}.stat.i b{color:var(--iris)}

  .member{display:flex;gap:13px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:17px;
    background:linear-gradient(165deg,rgba(30,36,80,.8),rgba(14,17,42,.7));margin-bottom:9px;cursor:pointer;
    transition:transform .15s,border-color .15s}
  .member:active{transform:scale(.985);border-color:rgba(255,95,141,.4)}
  .avatar{width:44px;height:44px;border-radius:14px;flex:0 0 44px;display:grid;place-items:center;
    font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;color:#0a0c1b;position:relative}
  .m-name{font-weight:600;font-size:15px}
  .m-meta{font-size:12px;color:var(--mist);margin-top:1px}
  .m-right{margin-left:auto;text-align:right}
  .countdown{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700}
  .countdown small{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);font-weight:400}
  .today-badge{background:var(--gold);color:#0a0c1b;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;
    letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 16px rgba(255,194,71,.5)}

  .window-nav{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .window-nav::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 14px;border-radius:99px;border:1px solid var(--line);
    background:rgba(30,36,80,.6);font-size:13px;color:var(--mist);font-family:"JetBrains Mono",monospace;cursor:pointer}
  .chip.active{background:var(--kia);border-color:var(--kia);color:#0a0c1b;font-weight:700;box-shadow:var(--glow)}
  .chip.passed{color:var(--jade);border-color:rgba(57,230,176,.3)}
  .cat{font-family:"Bricolage Grotesque",sans-serif;font-size:11px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--kia);margin:16px 0 8px}
  .cat:first-child{margin-top:2px}
  .item{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(160,180,255,.07);cursor:pointer}
  .item:last-child{border-bottom:0}
  .box{flex:0 0 22px;width:22px;height:22px;border-radius:8px;border:1.5px solid rgba(152,160,212,.35);margin-top:1px;
    display:grid;place-items:center;font-size:12px;color:#0a0c1b;transition:.18s}
  .box.on{background:var(--jade);border-color:var(--jade);box-shadow:0 0 14px rgba(57,230,176,.45)}
  .item.on .txt{color:var(--mist);text-decoration:line-through;text-decoration-color:rgba(152,160,212,.4)}
  .txt{font-size:14px;flex:1}
  .stamp{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--jade);margin-top:2px}
  .prog{height:6px;border-radius:3px;background:rgba(152,160,212,.14);overflow:hidden;margin-top:12px}
  .prog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--jade),#7cf0d0);
    box-shadow:0 0 12px rgba(57,230,176,.6);transition:width .5s}
  svg.chart{width:100%;height:190px;display:block;margin-top:6px}
  .glabel{font-family:"JetBrains Mono",monospace;font-size:9px;fill:var(--mist)}

  label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);margin:12px 0 5px;font-weight:600}
  input,select,textarea{width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--line);
    background:rgba(10,12,27,.75);color:var(--paper);font-family:"Public Sans",sans-serif;font-size:15px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--kia);outline-offset:1px;border-color:transparent}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:14px;border:0;
    font-family:"Public Sans",sans-serif;font-weight:600;font-size:14px;cursor:pointer}
  .btn-primary{background:linear-gradient(100deg,var(--kia),#ff8a6b);color:#0a0c1b;width:100%;box-shadow:var(--glow)}
  .btn-ghost{background:rgba(160,180,255,.09);color:var(--paper);border:1px solid var(--line)}
  .btn-danger{background:rgba(255,95,141,.12);color:var(--kia);border:1px solid rgba(255,95,141,.3)}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .btn-add{width:100%;padding:13px;border-radius:15px;border:1.5px dashed rgba(152,160,212,.28);background:transparent;
    color:var(--mist);font-family:"Public Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
  .qbtn{border-radius:18px;border:1px solid var(--line);padding:16px 8px;cursor:pointer;text-align:center;
    background:linear-gradient(165deg,rgba(30,36,80,.9),rgba(14,17,42,.7));transition:transform .14s}
  .qbtn:active{transform:scale(.95)}
  .qbtn svg{width:24px;height:24px;stroke-width:1.6;fill:none;display:block;margin:0 auto 6px}
  .qbtn span{font-size:12px;font-weight:600}
  .qbtn.on{border-color:var(--kia);box-shadow:var(--glow)}
  .qbtn.on svg{stroke:var(--kia)}
  .toggle{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid rgba(160,180,255,.07);cursor:pointer}
  .pill{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:10px;padding:3px 10px;border-radius:99px;
    border:1px solid var(--line);color:var(--mist);background:0;cursor:pointer}
  .pill.k{color:var(--kia);border-color:rgba(255,95,141,.4)}
  .pill.j{color:var(--jade);border-color:rgba(57,230,176,.4)}
  .pill.g{color:var(--gold);border-color:rgba(255,194,71,.4)}
  .note{font-size:11px;color:var(--mist);line-height:1.55;margin-top:10px}
  .empty{text-align:center;color:var(--mist);font-size:14px;padding:22px 10px;line-height:1.6}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .gcell{position:relative;aspect-ratio:1;border-radius:13px;overflow:hidden;border:1px solid var(--line);background:rgba(30,36,80,.6)}
  .gcell img{width:100%;height:100%;object-fit:cover;display:block}
  .gcell b{position:absolute;left:5px;bottom:4px;font-family:"JetBrains Mono",monospace;font-size:9px;
    background:rgba(10,12,27,.75);padding:2px 6px;border-radius:99px;font-weight:400}
  .lineage{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .lineage::-webkit-scrollbar{display:none}
  .gen{flex:0 0 auto;width:58px;text-align:center;padding:10px 4px;border-radius:14px;border:1px solid var(--line);
    background:rgba(30,36,80,.55)}
  .gen b{display:block;font-size:22px;font-family:"Bricolage Grotesque",serif;line-height:1.2}
  .gen span{font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--mist)}
  .gen.on{border-color:var(--kia);box-shadow:var(--glow)}
  .gen.on b{color:var(--kia)}

  .scrim{position:fixed;inset:0;background:rgba(5,6,16,.78);backdrop-filter:blur(4px);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:linear-gradient(180deg,#1a1f45,#11142e);
    border-radius:28px 28px 0 0;border-top:1px solid rgba(160,180,255,.2);
    padding:8px 18px calc(26px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
    transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.2,1);max-width:560px;margin:0 auto}
  .sheet.on{transform:translateY(0)}
  .grab{width:40px;height:4px;border-radius:2px;background:rgba(152,160,212,.3);margin:6px auto 14px}
  .sheet h2{font-size:21px;font-weight:800;margin-bottom:2px}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(10,12,27,.9);backdrop-filter:blur(18px);
    border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:none}
  nav.on{display:block}
  .tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
  .tab{background:0;border:0;color:var(--mist);font-family:"Public Sans",sans-serif;font-size:10.5px;font-weight:600;
    padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s}
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}
  .tab.on{color:var(--kia)}
  .tab.on svg{filter:drop-shadow(0 0 7px var(--kia))}
  .toast{position:fixed;left:50%;bottom:108px;transform:translate(-50%,14px);background:var(--ink3);
    border:1px solid var(--line);padding:11px 17px;border-radius:99px;font-size:13px;z-index:70;opacity:0;
    transition:.25s;max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  #gate{position:fixed;inset:0;z-index:80;background:var(--ink);display:grid;place-items:center;padding:24px}
  #gate .box2{width:100%;max-width:340px}
  .offline{background:rgba(255,194,71,.1);border:1px solid rgba(255,194,71,.3);color:var(--gold);font-size:12px;
    padding:9px 13px;border-radius:13px;margin-bottom:12px;display:none}
  .offline.on{display:block}
  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="gate"><div class="box2">
  <div class="eyebrow">Buku Keluarga</div>
  <h1 style="font-size:29px;font-weight:800;margin:8px 0 6px">Masuk</h1>
  <p class="note" style="margin:0 0 4px">Hanya ID keluarga yang terdaftar bisa membuka data ini.</p>
  <div id="gateBody"></div>
</div></div>

<div id="app" class="wrap"></div>

<nav id="nav"><div class="tabs">
  <button class="tab on" data-tab="keluarga">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17.5" cy="9" r="2.4"/><path d="M16 14.4c2.6-.4 4.5 1.4 4.5 4.6"/></svg>
    Keluarga</button>
  <button class="tab" data-tab="anak">
    <svg viewBox="0 0 24 24"><path d="M12 3.5c4.1 0 7 2.9 7 7v2.5c0 4-3 7-7 7s-7-3-7-7V10.5c0-4.1 2.9-7 7-7z"/><path d="M9.5 11h.01M14.5 11h.01"/><path d="M9.8 15c1.3 1.1 3.1 1.1 4.4 0"/></svg>
    Anak</button>
  <button class="tab" data-tab="imlek">
    <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 108.5 12A7 7 0 0112 3z"/><path d="M17.5 5.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z"/></svg>
    Imlek</button>
  <button class="tab" data-tab="agenda">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    Agenda</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fotoIn" accept="image/*" class="hidden">

<script>
(function(){
  var ICON="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0a0c1b"/><circle cx="256" cy="140" r="150" fill="#ff5f8d" opacity="0.16"/><line x1="86" y1="360" x2="426" y2="360" stroke="#98a0d4" stroke-width="10" stroke-opacity="0.35" stroke-linecap="round"/><path d="M86 360 L256 360" stroke="#ff5f8d" stroke-width="12" stroke-linecap="round"/><circle cx="256" cy="360" r="26" fill="#ff5f8d"/><circle cx="256" cy="360" r="46" fill="none" stroke="#ff5f8d" stroke-width="9" stroke-opacity="0.4"/><g fill="none" stroke="#eef1ff" stroke-width="22" stroke-linecap="round"><circle cx="256" cy="168" r="62"/></g><circle cx="234" cy="160" r="11" fill="#0a0c1b"/><circle cx="278" cy="160" r="11" fill="#0a0c1b"/><path d="M236 192 q20 16 40 0" fill="none" stroke="#0a0c1b" stroke-width="12" stroke-linecap="round"/></svg>');

function ribbon(id,am){
  const MAX=24,flags=[2,4,6,9,12,15,18,24];
  let ticks="";for(let i=0;i<=MAX;i++)ticks+=`<div class="tick" style="left:${i/MAX*100}%"></div>`;
  const nowFlag=flags.find(f=>f>am)||24;
  const fl=flags.map(f=>{const full=doneCount(id,f)===totalCount(f);
    return `<div class="flag ${f===nowFlag?"now":(am>=f&&full?"done":"")}" style="left:${f/MAX*100}%">${f}<i></i></div>`;}).join("");
  return `<div class="ribbon"><div class="ribbon-track">${ticks}<div class="ribbon-line"></div>
    <div class="ribbon-fill" style="width:${Math.min(am/MAX,1)*100}%"></div>${fl}</div>
    <div class="ribbon-cap"><span>LAHIR</span><span>PEMERIKSAAN BULAN KE-</span><span>2 TAHUN</span></div></div>`;
}
function whoChart(g,b,sex){
  const isW=curveMode==="berat";
  const T=isW?WFA[sex==="P"?"P":"L"]:LFA[sex==="P"?"P":"L"];
  const pts=g.filter(x=>isW?x.berat:x.tinggi).map(x=>({
    x:daysBetween(b,parse(x.tanggal))/30.4375, y:+(isW?x.berat:x.tinggi)}));
  const W=340,H=190,PL=30,PB=22,PT=10;
  const xMax=Math.max(6,Math.min(24,Math.ceil((pts.length?Math.max(...pts.map(p=>p.x)):3)+3)));
  const band=[];
  for(let mo=0;mo<=xMax;mo++){
    let lo,hi,md;
    if(isW){const[L,M,S]=T[mo];lo=M*Math.pow(1+L*S*-2,1/L);hi=M*Math.pow(1+L*S*2,1/L);md=M;}
    else{const[M,SD]=T[mo];lo=M-2*SD;hi=M+2*SD;md=M;}
    band.push({mo,lo,hi,md});
  }
  const yLo=Math.min(...band.map(p=>p.lo),...pts.map(p=>p.y))*.94;
  const yHi=Math.max(...band.map(p=>p.hi),...pts.map(p=>p.y))*1.04;
  const X=v=>PL+v/xMax*(W-PL-8), Y=v=>H-PB-(v-yLo)/((yHi-yLo)||1)*(H-PB-PT);
  const up=band.map((p,i)=>`${i?"L":"M"}${X(p.mo).toFixed(1)},${Y(p.hi).toFixed(1)}`).join(" ");
  const dn=band.slice().reverse().map(p=>`L${X(p.mo).toFixed(1)},${Y(p.lo).toFixed(1)}`).join(" ");
  const med=band.map((p,i)=>`${i?"L":"M"}${X(p.mo).toFixed(1)},${Y(p.md).toFixed(1)}`).join(" ");
  const line=pts.map((p,i)=>`${i?"L":"M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const unit=isW?"kg":"cm";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kurva pertumbuhan WHO">
    <defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c8cff" stop-opacity=".16"/><stop offset="1" stop-color="#7c8cff" stop-opacity=".05"/></linearGradient></defs>
    <path d="${up} ${dn} Z" fill="url(#bg1)" stroke="rgba(124,140,255,.35)" stroke-width="1"/>
    <path d="${med}" fill="none" stroke="rgba(152,160,212,.5)" stroke-width="1" stroke-dasharray="3 3"/>
    ${pts.length?`<path d="${line}" fill="none" stroke="#ff5f8d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 6px rgba(255,95,141,.7))"/>`:""}
    ${pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.4" fill="#0a0c1b" stroke="#ff5f8d" stroke-width="2"/>`).join("")}
    <text class="glabel" x="${PL}" y="${H-6}">0 bln</text>
    <text class="glabel" x="${W-8}" y="${H-6}" text-anchor="end">${xMax} bln</text>
    <text class="glabel" x="3" y="${PT+9}">${yHi.toFixed(0)} ${unit}</text>
    <text class="glabel" x="3" y="${H-PB}">${yLo.toFixed(0)} ${unit}</text>

function viewHarian(){
  const bs=babies();
  if(!activeBaby||!bs.find(b=>b.id===activeBaby))activeBaby=bs[0].id;
  const m=bs.find(b=>b.id===activeBaby),d=iso(today()),L=logsFor(m.id,d),sleeping=openSleep(m.id);
  const tidur=L.filter(x=>x.jenis==="tidur"&&x.selesai).reduce((n,x)=>n+durMin(x.mulai,x.selesai),0);
  const susu=L.filter(x=>x.jenis==="susu").reduce((n,x)=>n+(+x.jumlah||0),0);
  const susuN=L.filter(x=>x.jenis==="susu").length;
  const popok=L.filter(x=>x.jenis==="popok").length;
  const week=[];
  for(let i=6;i>=0;i--){const dd=new Date();dd.setDate(dd.getDate()-i);const k=iso(dd);
    const l=logsFor(m.id,k);
    week.push({k,d:dd,tidur:l.filter(x=>x.jenis==="tidur"&&x.selesai).reduce((n,x)=>n+durMin(x.mulai,x.selesai),0)/60});}
  const maxT=Math.max(8,...week.map(w=>w.tidur));

  return `<header><div><div class="eyebrow">Catatan harian</div><h1>${esc(m.nama)}</h1>

      <svg viewBox="0 0 24 24" stroke="${sleeping?"currentColor":"var(--iris)"}"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
      <span>${sleeping?"Bangun":"Mulai tidur"}</span>
      ${sleeping?`<div class="stamp" style="color:var(--kia)">sejak ${jam(sleeping.mulai)}</div>`:""}</div>
    <div class="qbtn tilt" onclick="editSusu()">
      <svg viewBox="0 0 24 24" stroke="var(--jade)"><path d="M8 3h8l-1 4H9L8 3z"/><path d="M9 7h6l1 12a2 2 0 01-2 2h-4a2 2 0 01-2-2L9 7z"/></svg>
      <span>Susu</span></div>
    <div class="qbtn tilt" onclick="logPopok()">
      <svg viewBox="0 0 24 24" stroke="var(--gold)"><path d="M4 6h16l-1.5 7a6 6 0 01-13 0L4 6z"/><path d="M9 17.5c0 1.4 1.3 2.5 3 2.5s3-1.1 3-2.5"/></svg>
      <span>Popok</span></div>
  </div>
  <div class="stats">
    <div class="stat i tilt"><span>Tidur</span><b>${Math.floor(tidur/60)}<small style="font-size:13px">j</small> ${tidur%60}<small style="font-size:13px">m</small></b><small>hari ini</small></div>
    <div class="stat j tilt"><span>Susu</span><b>${susu||"—"}</b><small>ml · ${susuN}x</small></div>
    <div class="stat g tilt"><span>Popok</span><b>${popok}</b><small>ganti</small></div>
  </div>
  <div class="sec-title">Tidur 7 hari terakhir</div>
  <div class="card tilt">
    <svg class="chart" style="height:130px" viewBox="0 0 340 130" role="img" aria-label="Grafik tidur mingguan">
      ${week.map((w,i)=>{const bw=34,x=14+i*46,h=(w.tidur/maxT)*88;
        return `<rect x="${x}" y="${104-h}" width="${bw}" height="${Math.max(2,h)}" rx="7"
          fill="${w.k===iso(today())?"#ff5f8d":"rgba(124,140,255,.55)"}"/>
        <text class="glabel" x="${x+bw/2}" y="122" text-anchor="middle">${HARI[w.d.getDay()].slice(0,2)}</text>
        <text class="glabel" x="${x+bw/2}" y="${98-h}" text-anchor="middle">${w.tidur?w.tidur.toFixed(1):""}</text>`;}).join("")}
    </svg>
    <p class="note">Bayi 6 bulan umumnya tidur 12–15 jam per 24 jam termasuk tidur siang. Angka di aplikasi hanya sebanyak yang sempat Anda catat.</p>
  </div>
  <div class="sec-title">Riwayat hari ini</div>
  <div class="card tilt">${timeline.length?timeline.map(x=>{
      const ic=x.jenis==="tidur"?"Tidur":x.jenis==="susu"?"Susu":"Popok";
      const det=x.jenis==="tidur"?(x.selesai?`${jam(x.mulai)}–${jam(x.selesai)} · ${dur(x.mulai,x.selesai)}`:`mulai ${jam(x.mulai)} · masih tidur`)
        :x.jenis==="susu"?`${jam(x.mulai)} · ${x.jumlah||"?"} ml`:`${jam(x.mulai)}${x.catatan?" · "+esc(x.catatan):""}`;
      return `<div class="item" style="cursor:default"><div class="txt"><b>${ic}</b>
        <div class="stamp" style="color:var(--mist)">${det}</div></div>

    :'<div class="empty">Belum ada catatan hari ini. Ketuk salah satu tombol di atas.</div>'}</div>`;
}

function bpLabel(sis,dia){
  if(!sis||!dia)return["—","var(--mist)"];
  if(sis>=180||dia>=120)return["Krisis, cari bantuan medis","var(--kia)"];
  if(sis>=140||dia>=90)return["Hipertensi derajat 2","var(--kia)"];
  if(sis>=130||dia>=80)return["Hipertensi derajat 1","var(--gold)"];
  if(sis>=120)return["Meningkat","var(--gold)"];
  return["Normal","var(--jade)"];
}
function adultModules(id){

  const ct=DB.contacts[id]||[],pf=DB.prefs[id]||[];

  const spark=(()=>{
    const p=v.slice(0,12).reverse().filter(x=>x.sistolik);
    if(p.length<2)return"";
    const W=300,H=54,mx=Math.max(...p.map(x=>x.sistolik))+8,mn=Math.min(...p.map(x=>x.diastolik||60))-8;
    const X=i=>6+i/(p.length-1)*(W-12),Y=val=>H-6-(val-mn)/((mx-mn)||1)*(H-14);
    const l1=p.map((x,i)=>`${i?"L":"M"}${X(i).toFixed(0)},${Y(x.sistolik).toFixed(0)}`).join(" ");
    const l2=p.map((x,i)=>`${i?"L":"M"}${X(i).toFixed(0)},${Y(x.diastolik||60).toFixed(0)}`).join(" ");
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:54px;display:block;margin:6px 0">
      <path d="${l1}" fill="none" stroke="#ff5f8d" stroke-width="2"/>
      <path d="${l2}" fill="none" stroke="#7c8cff" stroke-width="2"/></svg>`;
  })();
  return `
  <div class="sec-title" style="margin:22px 0 6px">Tanda vital <span class="pill" onclick="editVital('${id}')">+ Catat</span></div>
  ${last?`<div class="stats" style="margin-bottom:8px">

      &nbsp;terakhir ${fmt(last.tanggal)} · <span onclick="allVitals('${id}')" style="color:var(--kia);cursor:pointer">riwayat ${v.length}</span></div>
    <p class="note">Klasifikasi mengikuti pedoman umum tekanan darah dewasa. Satu pengukuran tinggi belum berarti hipertensi — yang dinilai dokter adalah pola berulang.</p>`
   :'<div class="empty" style="padding:12px">Belum ada catatan tensi, gula, atau berat.</div>'}

  <div class="sec-title" style="margin:22px 0 6px">Hasil lab <span class="pill" onclick="editLab('${id}')">+ Tambah</span></div>
  ${lb.length?lb.slice(0,6).map(x=>{
    const c=x.status==="tinggi"||x.status==="rendah"?"var(--gold)":x.status==="kritis"?"var(--kia)":"var(--jade)";
    return `<div class="item" onclick="editLab('${id}','${x.id}')"><div class="txt"><b>${esc(x.nama)}</b>
      <span class="mono" style="color:${c}">${esc(x.nilai||"")} ${esc(x.satuan||"")}</span>
      <div class="stamp" style="color:var(--mist)">${fmt(x.tanggal)}${x.rujukan?" · rujukan "+esc(x.rujukan):""}</div></div></div>`;}).join("")
   :'<div class="empty" style="padding:12px">Belum ada hasil lab.</div>'}

  <div class="sec-title" style="margin:22px 0 6px">Kontak darurat <span class="pill" onclick="editContact('${id}')">+ Tambah</span></div>
  ${ct.length?ct.map(c=>`<div class="item" onclick="editContact('${id}','${c.id}')"><div class="txt">

   :'<div class="empty" style="padding:12px">Belum ada kontak darurat.</div>'}

      <span class="pill">${esc(p.kategori)}</span> ${esc(p.isi)}
      ${p.catatan?`<div class="stamp" style="color:var(--mist)">${esc(p.catatan)}</div>`:""}</div></div>`).join("")

/* ============ kalender Imlek ============ */
const STEM={"甲":["Yang","Kayu"],"乙":["Yin","Kayu"],"丙":["Yang","Api"],"丁":["Yin","Api"],"戊":["Yang","Tanah"],
  "己":["Yin","Tanah"],"庚":["Yang","Logam"],"辛":["Yin","Logam"],"壬":["Yang","Air"],"癸":["Yin","Air"]};
const BRANCH={"子":"Tikus","丑":"Kerbau","寅":"Macan","卯":"Kelinci","辰":"Naga","巳":"Ular",
  "午":"Kuda","未":"Kambing","申":"Monyet","酉":"Ayam","戌":"Anjing","亥":"Babi"};
function lunarParts(dt){const o={};
  try{new Intl.DateTimeFormat("en-u-ca-chinese",{year:"numeric",month:"numeric",day:"numeric"})
    .formatToParts(dt).forEach(x=>o[x.type]=x.value);}catch(e){}
  return o;}
function ganzhi(dt){
  try{const t=new Intl.DateTimeFormat("zh-TW-u-ca-chinese",{year:"numeric"}).format(dt);
    const m=t.match(/([甲乙丙丁戊己庚辛壬癸])([子丑寅卯辰巳午未申酉戌亥])/);
    if(!m)return null;
    return{stem:m[1],branch:m[2],shio:BRANCH[m[2]],elemen:STEM[m[1]][1],yin:STEM[m[1]][0],teks:m[1]+m[2]};}
  catch(e){return null;}}
function findLunar(bulan,hari,from){
  const c=new Date(from);
  for(let i=0;i<420;i++){c.setDate(c.getDate()+1);const l=lunarParts(c);
    if(l.month===String(bulan)&&l.day===String(hari))return new Date(c);}
  return null;}
function imlekEvents(){
  const n=today(),out=[];
  [["Imlek 春節",1,1],["Cap Go Meh 元宵",1,15],["Peh Cun 端午",5,5],
   ["Sembahyang Rebutan 中元",7,15],["Tiong Chiu 中秋",8,15],["Chong Yang 重陽",9,9],
   ["Laba 臘八",12,8]].forEach(([nama,b,h])=>{
     const d=findLunar(b,h,n);if(d)out.push({d,t:nama,s:`Lunar ${b}/${h}`,c:"var(--kia)"});});
  const y=n.getFullYear();
  [[3,4,"Qingming 清明"],[11,21,"Dongzhi 冬至"]].forEach(([mo,da,nama])=>{
    let d=new Date(y,mo,da);if(d<n)d=new Date(y+1,mo,da);
    out.push({d,t:nama,s:"Titik matahari, tanggal bisa bergeser 1 hari",c:"var(--gold)"});});
  (DB.ancestors||[]).filter(a=>a.wafat).forEach(a=>{
    const w=parse(a.wafat);let d=new Date(n.getFullYear(),w.getMonth(),w.getDate());
    if(d<n)d=new Date(n.getFullYear()+1,w.getMonth(),w.getDate());
    out.push({d,t:`Haul ${a.nama}`,s:`Wafat ${fmt(a.wafat)}${a.wafat_lunar?" · lunar "+esc(a.wafat_lunar):""}`,c:"var(--iris)",haul:true});});
  return out.sort((a,b)=>a.d-b.d);
}
function viewImlek(){
  const n=today(),lp=lunarParts(n),gz=ganzhi(n);
  const imlek=findLunar(1,1,n),sisa=imlek?daysBetween(n,imlek):null;
  const gzNext=imlek?ganzhi(new Date(imlek.getFullYear(),imlek.getMonth(),imlek.getDate()+40)):null;
  const ev=imlekEvents().slice(0,12);
  const anggota=DB.family.map(m=>({m,g:ganzhi(parse(m.tanggal))})).filter(x=>x.g);
  if(!lp.month)return `<header><div><div class="eyebrow">Kalender Imlek</div><h1>Tidak didukung</h1></div></header>
    <div class="card tilt"><div class="empty">Peramban di perangkat ini tidak menyediakan kalender Tionghoa.</div></div>`;
  return `<header><div><div class="eyebrow">Kalender Imlek</div><h1>农历</h1>
    <div class="sub">${HARI[n.getDay()]}, ${fmt(n)}</div></div></header>
  <div class="hero tilt"><div class="sheen"></div><div class="layer">
    <div class="name">Hari ini menurut penanggalan lunar</div>
    <div class="age-big">Bulan ${lp.month} <small>hari ${lp.day}</small></div>
    <div class="daycount">TAHUN <b>${gz?gz.teks:"—"}</b> · SHIO <b>${gz?gz.shio.toUpperCase():"—"}</b> · ${gz?gz.yin+" "+gz.elemen:""}</div>
    ${sisa!=null?`<div class="ribbon"><div class="ribbon-track"><div class="ribbon-line"></div>
      <div class="ribbon-fill" style="width:${Math.max(4,100-(sisa/354*100)).toFixed(0)}%"></div>
      <div class="flag now" style="left:100%">${sisa}<i></i></div></div>
      <div class="ribbon-cap"><span>IMLEK LALU</span><span>${sisa} HARI LAGI</span><span>${fmtShort(imlek)}</span></div></div>`:""}
  </div></div>
  ${gzNext?`<div class="card tilt" style="margin-top:12px"><div class="eyebrow">Tahun baru berikutnya</div>
    <div style="font-size:17px;font-weight:600;margin-top:4px">${fmt(imlek)} · Tahun ${gzNext.teks} — shio ${gzNext.shio}</div>
    <p class="note">Unsur ${gzNext.yin} ${gzNext.elemen}. Tanggal Imlek berubah tiap tahun karena mengikuti bulan baru, bukan matahari.</p></div>`:""}

  <div class="sec-title">Hari besar & sembahyang</div>
  ${ev.map(o=>{const dd=daysBetween(n,o.d);
    return `<div class="member" style="cursor:default">
      <div style="width:4px;height:38px;border-radius:2px;background:${o.c};flex:0 0 4px;box-shadow:0 0 10px ${o.c}"></div>
      <div><div class="m-name">${esc(o.t)}</div><div class="m-meta">${esc(o.s)} · ${fmt(o.d)}</div></div>
      <div class="m-right"><div class="countdown" style="font-size:11px">${dd===0?"HARI INI":dd+" hari"}</div></div></div>`;}).join("")}
  <p class="note">Tanggal lunar dihitung oleh mesin kalender Tionghoa bawaan perangkat. Qingming dan Dongzhi mengikuti posisi matahari, jadi bisa meleset satu hari dari almanak cetak.</p>

  <div class="sec-title">Shio & elemen keluarga</div>
  <div class="card tilt">${anggota.map(({m,g})=>`<div class="item" style="cursor:default"><div class="txt">
    <b>${esc(m.nama)}</b> <span class="pill k">${g.shio}</span>
    <div class="stamp" style="color:var(--mist)">${g.teks} · ${g.yin} ${g.elemen} · lahir ${fmt(m.tanggal)}</div></div></div>`).join("")
    ||'<div class="empty">Belum ada profil.</div>'}
    <p class="note">Shio ditentukan tahun lunar, bukan 1 Januari. Anak yang lahir Januari atau awal Februari sering masuk shio tahun sebelumnya.</p></div>`;
}

function agendaItems(){
  const n=today(),out=[];
  DB.family.forEach(m=>{const nb=nextBirthday(m.tanggal);
    if(nb)out.push({d:nb.date,t:`Ulang tahun ${m.nama}`,s:`${nb.turning} tahun`,c:"var(--gold)",yearly:true});});
  (DB.events||[]).forEach(e=>{
    let d=parse(e.tanggal);
    if(e.tahunan){const nx=new Date(n.getFullYear(),d.getMonth(),d.getDate());d=nx<n?new Date(n.getFullYear()+1,d.getMonth(),d.getDate()):nx;}
    out.push({d,t:e.judul,s:[e.jam,e.lokasi].filter(Boolean).join(" · ")||"Acara keluarga",c:"var(--iris)",yearly:e.tahunan,ev:e.id});});
  babies().forEach(m=>{const b=parse(m.tanggal),D=bd(m.id);
    VAKSIN.forEach(([mo,nm],i)=>{if(D.vax["v"+i])return;const due=addMonths(b,mo);
      if(daysBetween(n,due)>-120)out.push({d:due,t:`${nm} — ${m.nama}`,s:`Imunisasi ${mo} bln`,c:"var(--jade)"});});
    Object.keys(MILESTONES).map(Number).forEach(w=>{const due=addMonths(b,w),left=totalCount(w)-doneCount(m.id,w);
      if(left>0&&daysBetween(n,due)>-60)out.push({d:due,t:`Cek milestone ${w} bulan — ${m.nama}`,s:`${left} poin belum tercapai`,c:"var(--kia)"});});
    D.goals.filter(g=>!g.done&&g.target).forEach(g=>out.push({d:parse(g.target),t:g.judul,s:`Target ${m.nama}`,c:"#c98bf0"}));});
  return out.sort((a,b)=>a.d-b.d);
}

  const n=today(),all=agendaItems(),soon=all.filter(o=>daysBetween(n,o.d)>=-14).slice(0,30);

    <button class="gear" onclick="editEvent()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></header>
    ${soon.map(o=>{const dd=daysBetween(n,o.d);
      return `<div class="member" ${o.ev?`onclick="editEvent('${o.ev}')"`:'style="cursor:default"'}>
      <div style="width:4px;height:38px;border-radius:2px;background:${o.c};flex:0 0 4px;box-shadow:0 0 10px ${o.c}"></div>
      <div><div class="m-name">${esc(o.t)}</div><div class="m-meta">${esc(o.s)} · ${fmt(o.d)}</div></div>
      <div class="m-right"><div class="countdown" style="font-size:11px;color:${dd<0?"var(--gold)":"inherit"}">${dd===0?"HARI INI":dd<0?`${-dd} hari lewat`:`${dd} hari lagi`}</div></div></div>`;}).join("")
      ||'<div class="empty">Belum ada agenda.</div>'}
    ${soon.length?`<button class="btn-add" onclick="exportICS()">Kirim ke kalender ponsel (.ics)</button>`:""}
    <p class="note">Aplikasi ini tidak membunyikan alarm saat tertutup. Ekspor ke kalender kalau ingin diingatkan H-1.</p>`;
}
window.editEvent=function(id){
  const e=(DB.events||[]).find(x=>x.id===id)||{judul:"",tanggal:iso(today()),jam:"",lokasi:"",catatan:"",tahunan:false};
  openSheet(`<h2>${id?"Ubah acara":"Acara keluarga"}</h2>
    <label>Judul</label><input id="e_judul" value="${esc(e.judul)}" placeholder="Makan malam Imlek">
    <div class="row2"><div><label>Tanggal</label><input id="e_tgl" type="date" value="${esc(String(e.tanggal).slice(0,10))}"></div>
    <div><label>Jam</label><input id="e_jam" value="${esc(e.jam)}" placeholder="18:30"></div></div>
    <label>Lokasi</label><input id="e_lok" value="${esc(e.lokasi)}" placeholder="Rumah Mama">
    <label>Catatan</label><textarea id="e_cat" rows="2">${esc(e.catatan)}</textarea>
    <div class="toggle" onclick="var b=document.getElementById('e_thn');b.classList.toggle('on');b.textContent=b.classList.contains('on')?'✓':''">
      <div class="box ${e.tahunan?"on":""}" id="e_thn">${e.tahunan?"✓":""}</div>
      <div class="txt">Berulang tiap tahun</div></div>
    <div style="height:16px"></div>
    <button class="btn btn-primary" onclick="saveEvent('${id||""}')">Simpan acara</button>
    ${id?`<button class="btn btn-danger" style="width:100%;margin-top:9px" onclick="delEvent('${id}')">Hapus acara</button>`:""}`);
};
window.saveEvent=function(id){
  const judul=$("#e_judul").value.trim();
  if(!judul)return toast("Isi judul acaranya.");
  const row={id:id||uid(),judul,tanggal:$("#e_tgl").value,jam:$("#e_jam").value.trim(),
    lokasi:$("#e_lok").value.trim(),catatan:$("#e_cat").value.trim(),tahunan:$("#e_thn").classList.contains("on")};
  tx(()=>sb.from("events").upsert(row),"Acara tersimpan").then(closeSheet);
};
window.delEvent=function(id){tx(()=>sb.from("events").delete().eq("id",id),"Acara dihapus").then(closeSheet);};
function dl(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}
window.exportICS=function(){
  const p2=x=>String(x).padStart(2,"0"),dt=d=>`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}`;
  let s="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Buku Keluarga//ID\r\nCALSCALE:GREGORIAN\r\n";
  agendaItems().forEach((o,i)=>{
    const end=new Date(o.d.getFullYear(),o.d.getMonth(),o.d.getDate()+1);
    s+="BEGIN:VEVENT\r\n"+`UID:bk-${i}-${dt(o.d)}@keluarga\r\n`+`DTSTAMP:${dt(today())}T090000Z\r\n`
      +`DTSTART;VALUE=DATE:${dt(o.d)}\r\nDTEND;VALUE=DATE:${dt(end)}\r\n`
      +`SUMMARY:${o.t.replace(/[,;\\]/g,"")}\r\nDESCRIPTION:${String(o.s).replace(/[,;\\]/g,"")}\r\n`
      +(o.yearly?"RRULE:FREQ=YEARLY\r\n":"")
      +"BEGIN:VALARM\r\nTRIGGER:-P1D\r\nACTION:DISPLAY\r\nDESCRIPTION:Pengingat\r\nEND:VALARM\r\nEND:VEVENT\r\n";});
  s+="END:VCALENDAR";
  dl(new Blob([s],{type:"text/calendar"}),"agenda-keluarga.ics");
  toast("Buka file .ics untuk memasukkannya ke kalender");
};

/* ============ pengaturan ============ */
window.openSettings=async function(){
  const{data}=await sb.from("allowed_emails").select("email,nama").order("email");
  openSheet(`<h2>Pengaturan</h2>
  <div class="sec-title" style="margin:18px 0 6px">Masuk sebagai</div>
  <div class="card" style="margin:0"><b>${esc(me?me.email.split("@")[0].replace(/\./g," ").toUpperCase():"—")}</b>
    <p class="note" style="margin-top:4px">Data yang sama muncul di setiap perangkat yang masuk dengan email terdaftar.</p></div>
  <div class="sec-title" style="margin:22px 0 6px">Yang punya akses</div>
  ${(data||[]).map(x=>`<div class="item" style="cursor:default"><div class="txt">${esc(x.nama||"—")}
    <div class="stamp" style="color:var(--mist)">ID ${esc(x.email.split("@")[0].replace(/\./g," ").toUpperCase())}</div></div></div>`).join("")||'<div class="empty">Tidak terbaca.</div>'}
  <p class="note">Daftar ini hanya bisa diubah lewat Supabase SQL Editor, bukan dari aplikasi.</p>
  <div class="sec-title" style="margin:22px 0 6px">Lainnya</div>
  <button class="btn btn-ghost" style="width:100%" onclick="syncNow()">Muat ulang dari server</button>
  <button class="btn btn-ghost" style="width:100%;margin-top:9px" onclick="changePass()">Ganti kata sandi</button>
  <button class="btn btn-ghost" style="width:100%;margin-top:9px" onclick="exportJSON()">Simpan cadangan (.json)</button>
  <button class="btn btn-danger" style="width:100%;margin-top:9px" onclick="signOut()">Keluar dari perangkat ini</button>
  <div style="height:10px"></div>`);
};
window.syncNow=async function(){try{await pull();render();toast("Data terbaru dimuat");}catch(e){fail(e);}};
window.changePass=function(){
  openSheet(`<h2>Ganti kata sandi</h2><p class="note" style="margin-top:2px">Minimal 6 karakter. Berlaku di semua perangkat.</p>
    <label>Kata sandi baru</label><input id="c_p1" type="password" autocomplete="new-password">
    <label>Ulangi</label><input id="c_p2" type="password" autocomplete="new-password">
    <div style="height:16px"></div><button class="btn btn-primary" id="c_go" onclick="changePassGo()">Simpan</button>`);
};
window.changePassGo=async function(){
  const a=$("#c_p1").value,b=$("#c_p2").value;
  if(a.length<6)return toast("Minimal 6 karakter.");
  if(a!==b)return toast("Kata sandi tidak sama.");
  $("#c_go").disabled=true;
  const{error}=await sb.auth.updateUser({password:a});
  if(error){$("#c_go").disabled=false;return toast("Gagal mengganti kata sandi.");}
  closeSheet();toast("Kata sandi diperbarui");
};
window.exportJSON=function(){
  dl(new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}),`buku-keluarga-${iso(today())}.json`);
  toast("Cadangan diunduh");
};

/* ============ boot ============ */
function render(){
  $("#app").innerHTML = tab==="keluarga"?viewKeluarga():tab==="anak"?viewAnak():tab==="imlek"?viewImlek():viewAgenda();
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===tab));
  if(tab==="anak"&&anakMode==="tumbuh")loadFotos();
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{tab=t.dataset.tab;win=null;render();});
window.addEventListener("online",()=>{syncNow();});
window.addEventListener("offline",()=>render());
sb.auth.onAuthStateChange((event,session)=>{
  if(session&&!me){history.replaceState(null,"",APP_URL);start(session);}
});
const{data:{session}}=await sb.auth.getSession();
if(session)start(session);else if(!location.hash.includes("access_token"))gateEmail();
</script>

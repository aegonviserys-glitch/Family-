<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Buku Keluarga</title>
<meta name="theme-color" content="#0a0c1b">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" id="favicon" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --ink:#0a0c1b;--ink2:#141833;--ink3:#1e2450;--line:rgba(160,180,255,.13);
    --kia:#ff5f8d;--jade:#39e6b0;--gold:#ffc247;--iris:#7c8cff;--mist:#98a0d4;--paper:#eef1ff;
    --glow:0 0 24px rgba(255,95,141,.35);
    --px:50%;--py:30%;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--paper);font-family:"Public Sans",system-ui,sans-serif;
    font-size:15px;line-height:1.5;padding-bottom:104px;overflow-x:hidden;-webkit-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  /* ambient scene */
  body::before{content:"";position:fixed;inset:-20%;z-index:-2;
    background:
      radial-gradient(600px 380px at calc(var(--px)) calc(var(--py)), rgba(255,95,141,.18), transparent 65%),
      radial-gradient(700px 500px at 90% 105%, rgba(124,140,255,.16), transparent 65%),
      radial-gradient(500px 400px at 5% 60%, rgba(57,230,176,.09), transparent 70%);
    transition:background-position .3s}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(160,180,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(160,180,255,.05) 1px,transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(circle at 50% 22%, #000 0%, transparent 72%);
    -webkit-mask-image:radial-gradient(circle at 50% 22%, #000 0%, transparent 72%)}
  h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.025em;line-height:1.12}
  .mono{font-family:"JetBrains Mono",monospace}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  header{padding:24px 0 12px;display:flex;align-items:flex-start;gap:10px}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mist)}
  header h1{font-size:31px;font-weight:800;margin-top:5px;
    background:linear-gradient(100deg,#fff,#b9c2ff 55%,#ff9ab7);-webkit-background-clip:text;background-clip:text;color:transparent}
  header .sub{color:var(--mist);font-size:13px;margin-top:4px}
  .gear{margin-left:auto;margin-top:6px;background:rgba(160,180,255,.09);border:1px solid var(--line);
    border-radius:13px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:0 0 40px}
  .gear svg{width:19px;height:19px;stroke:var(--mist);fill:none;stroke-width:1.7}

  /* kedalaman statis: tepi bercahaya + kilau yang bergerak sendiri */
  .tilt{position:relative}
  .tilt::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(145deg,rgba(255,95,141,.55),rgba(124,140,255,.35) 42%,transparent 70%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;opacity:.75}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .card,.hero,.stat,.member,.qbtn{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
  .card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}
  @keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
  .hero .sheen{position:absolute;top:0;bottom:0;width:38%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.09),transparent);
    animation:sweep 6.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .flag.now i{animation:pulse 2.2s ease-in-out infinite}
  .card{position:relative;background:linear-gradient(165deg,rgba(30,36,80,.92),rgba(15,18,45,.78));
    border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;overflow:hidden;
    box-shadow:0 18px 40px -28px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06)}
  .card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:20px;
    background:radial-gradient(340px 200px at var(--px) var(--py), rgba(255,255,255,.09), transparent 60%)}
  .sec-title{font-family:"Bricolage Grotesque",sans-serif;font-size:12px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--mist);margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}

  /* hero */
  .hero{position:relative;border-radius:26px;padding:22px 20px 20px;overflow:hidden;
    background:linear-gradient(155deg,#2b1740,#161a3d 52%,#0b0e22);
    border:1px solid rgba(255,95,141,.3);
    box-shadow:0 30px 60px -34px rgba(255,95,141,.5), inset 0 1px 0 rgba(255,255,255,.08)}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(320px 200px at var(--px) var(--py), rgba(255,255,255,.13), transparent 62%)}
  .hero .layer{position:relative;z-index:2}
  .hero .name{font-size:12px;color:var(--kia);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
  .age-big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:42px;line-height:1;margin-top:8px;
    text-shadow:0 6px 22px rgba(255,95,141,.4)}
  .age-big small{font-size:17px;font-weight:600;color:var(--mist);margin-left:3px;text-shadow:none}
  .daycount{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--mist);margin-top:8px;letter-spacing:.04em}
  .daycount b{color:var(--paper)}
  .ribbon{margin-top:20px}
  .ribbon-track{position:relative;height:46px}
  .ribbon-line{position:absolute;top:22px;left:0;right:0;height:3px;background:rgba(152,160,212,.18);border-radius:2px}
  .ribbon-fill{position:absolute;top:22px;left:0;height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--kia),#ffa46b);box-shadow:0 0 14px rgba(255,95,141,.7);
    transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .tick{position:absolute;top:16px;width:1px;height:8px;background:rgba(152,160,212,.3);transform:translateX(-.5px)}
  .flag{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--mist)}
  .flag i{display:block;width:7px;height:7px;border-radius:50%;border:1.5px solid rgba(152,160,212,.5);margin:2px auto 0}
  .flag.done i{background:var(--jade);border-color:var(--jade);box-shadow:0 0 10px rgba(57,230,176,.8)}
  .flag.now i{background:var(--kia);border-color:var(--kia);box-shadow:0 0 0 5px rgba(255,95,141,.18),0 0 14px var(--kia)}
  .flag.now{color:var(--kia)}
  .ribbon-cap{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--mist);margin-top:4px;letter-spacing:.1em}

  /* stat grid */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
  .stat{position:relative;border-radius:16px;padding:12px 11px;border:1px solid var(--line);
    background:linear-gradient(165deg,rgba(30,36,80,.9),rgba(14,17,42,.75));overflow:hidden}
  .stat::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 45%)}
  .stat b{display:block;position:relative;font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:800;line-height:1.1;margin-top:3px}
  .stat span{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
  .stat small{font-size:11px;color:var(--mist)}
  .stat.k b{color:var(--kia)}.stat.j b{color:var(--jade)}.stat.g b{color:var(--gold)}.stat.i b{color:var(--iris)}

  .member{display:flex;gap:13px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:17px;
    background:linear-gradient(165deg,rgba(30,36,80,.8),rgba(14,17,42,.7));margin-bottom:9px;cursor:pointer;
    transition:transform .15s,border-color .15s}
  .member:active{transform:scale(.985);border-color:rgba(255,95,141,.4)}
  .avatar{width:44px;height:44px;border-radius:14px;flex:0 0 44px;display:grid;place-items:center;
    font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;color:#0a0c1b;position:relative}
  .m-name{font-weight:600;font-size:15px}
  .m-meta{font-size:12px;color:var(--mist);margin-top:1px}
  .m-right{margin-left:auto;text-align:right}
  .countdown{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700}
  .countdown small{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);font-weight:400}
  .today-badge{background:var(--gold);color:#0a0c1b;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;
    letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 16px rgba(255,194,71,.5)}

  .window-nav{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .window-nav::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 14px;border-radius:99px;border:1px solid var(--line);
    background:rgba(30,36,80,.6);font-size:13px;color:var(--mist);font-family:"JetBrains Mono",monospace;cursor:pointer}
  .chip.active{background:var(--kia);border-color:var(--kia);color:#0a0c1b;font-weight:700;box-shadow:var(--glow)}
  .chip.passed{color:var(--jade);border-color:rgba(57,230,176,.3)}
  .cat{font-family:"Bricolage Grotesque",sans-serif;font-size:11px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--kia);margin:16px 0 8px}
  .cat:first-child{margin-top:2px}
  .item{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(160,180,255,.07);cursor:pointer}
  .item:last-child{border-bottom:0}
  .box{flex:0 0 22px;width:22px;height:22px;border-radius:8px;border:1.5px solid rgba(152,160,212,.35);margin-top:1px;
    display:grid;place-items:center;font-size:12px;color:#0a0c1b;transition:.18s}
  .box.on{background:var(--jade);border-color:var(--jade);box-shadow:0 0 14px rgba(57,230,176,.45)}
  .item.on .txt{color:var(--mist);text-decoration:line-through;text-decoration-color:rgba(152,160,212,.4)}
  .txt{font-size:14px;flex:1}
  .stamp{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--jade);margin-top:2px}
  .prog{height:6px;border-radius:3px;background:rgba(152,160,212,.14);overflow:hidden;margin-top:12px}
  .prog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--jade),#7cf0d0);
    box-shadow:0 0 12px rgba(57,230,176,.6);transition:width .5s}
  svg.chart{width:100%;height:190px;display:block;margin-top:6px}
  .glabel{font-family:"JetBrains Mono",monospace;font-size:9px;fill:var(--mist)}

  label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);margin:12px 0 5px;font-weight:600}
  input,select,textarea{width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--line);
    background:rgba(10,12,27,.75);color:var(--paper);font-family:"Public Sans",sans-serif;font-size:15px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--kia);outline-offset:1px;border-color:transparent}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:14px;border:0;
    font-family:"Public Sans",sans-serif;font-weight:600;font-size:14px;cursor:pointer}
  .btn-primary{background:linear-gradient(100deg,var(--kia),#ff8a6b);color:#0a0c1b;width:100%;box-shadow:var(--glow)}
  .btn-ghost{background:rgba(160,180,255,.09);color:var(--paper);border:1px solid var(--line)}
  .btn-danger{background:rgba(255,95,141,.12);color:var(--kia);border:1px solid rgba(255,95,141,.3)}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .btn-add{width:100%;padding:13px;border-radius:15px;border:1.5px dashed rgba(152,160,212,.28);background:transparent;
    color:var(--mist);font-family:"Public Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
  .qbtn{border-radius:18px;border:1px solid var(--line);padding:16px 8px;cursor:pointer;text-align:center;
    background:linear-gradient(165deg,rgba(30,36,80,.9),rgba(14,17,42,.7));transition:transform .14s}
  .qbtn:active{transform:scale(.95)}
  .qbtn svg{width:24px;height:24px;stroke-width:1.6;fill:none;display:block;margin:0 auto 6px}
  .qbtn span{font-size:12px;font-weight:600}
  .qbtn.on{border-color:var(--kia);box-shadow:var(--glow)}
  .qbtn.on svg{stroke:var(--kia)}
  .toggle{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid rgba(160,180,255,.07);cursor:pointer}
  .pill{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:10px;padding:3px 10px;border-radius:99px;
    border:1px solid var(--line);color:var(--mist);background:0;cursor:pointer}
  .pill.k{color:var(--kia);border-color:rgba(255,95,141,.4)}
  .pill.j{color:var(--jade);border-color:rgba(57,230,176,.4)}
  .pill.g{color:var(--gold);border-color:rgba(255,194,71,.4)}
  .note{font-size:11px;color:var(--mist);line-height:1.55;margin-top:10px}
  .empty{text-align:center;color:var(--mist);font-size:14px;padding:22px 10px;line-height:1.6}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .gcell{position:relative;aspect-ratio:1;border-radius:13px;overflow:hidden;border:1px solid var(--line);background:rgba(30,36,80,.6)}
  .gcell img{width:100%;height:100%;object-fit:cover;display:block}
  .gcell b{position:absolute;left:5px;bottom:4px;font-family:"JetBrains Mono",monospace;font-size:9px;
    background:rgba(10,12,27,.75);padding:2px 6px;border-radius:99px;font-weight:400}
  .tree{padding-left:2px}
  .node{position:relative;padding-left:22px;margin-top:8px}
  .node.root{padding-left:0}
  .node::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:1.5px;
    background:linear-gradient(180deg,rgba(255,95,141,.5),rgba(124,140,255,.25))}
  .node.root::before{display:none}
  .node.last::before{bottom:auto;height:26px}
  .node::after{content:"";position:absolute;left:6px;top:26px;width:14px;height:1.5px;background:rgba(160,180,255,.3)}
  .node.root::after{display:none}
  .pcard{display:flex;gap:11px;align-items:center;padding:9px 12px;border:1px solid var(--line);
    border-radius:15px;background:linear-gradient(165deg,rgba(30,36,80,.85),rgba(14,17,42,.7));cursor:pointer}
  .pcard:active{border-color:rgba(255,95,141,.5)}
  .pcard .av{width:40px;height:40px;border-radius:13px;flex:0 0 40px;display:grid;place-items:center;
    font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:16px;color:#0a0c1b;overflow:hidden;position:relative}
  .pcard .av img{width:100%;height:100%;object-fit:cover}
  .pcard .nm{font-weight:600;font-size:14.5px}
  .pcard .mt{font-size:11px;color:var(--mist);margin-top:1px}
  .spouse{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:3px 9px;border-radius:99px;
    border:1px dashed rgba(255,95,141,.35);font-size:11px;color:var(--mist)}
  .avwrap{position:relative}
  .avwrap .cam{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;
    background:var(--kia);display:grid;place-items:center;font-size:11px;color:#0a0c1b}
  .lineage{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .lineage::-webkit-scrollbar{display:none}
  .gen{flex:0 0 auto;width:58px;text-align:center;padding:10px 4px;border-radius:14px;border:1px solid var(--line);
    background:rgba(30,36,80,.55)}
  .gen b{display:block;font-size:22px;font-family:"Bricolage Grotesque",serif;line-height:1.2}
  .gen span{font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--mist)}
  .gen.on{border-color:var(--kia);box-shadow:var(--glow)}
  .gen.on b{color:var(--kia)}

  /* ===== panggung pohon ===== */
  #stage{position:fixed;inset:0;z-index:20;background:#070912;display:none;touch-action:none;overflow:hidden}
  #stage.on{display:block}
  #sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #stage svg#tsvg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .tbar{position:absolute;top:0;left:0;right:0;z-index:3;padding:14px 16px 26px;
    background:linear-gradient(180deg,rgba(7,9,18,.95) 30%,transparent);pointer-events:none;
    padding-top:calc(14px + env(safe-area-inset-top))}
  .tbar h1{font-size:21px;font-weight:800;
    background:linear-gradient(100deg,#fff,#ffb3c8 60%,#a9b6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tools{position:absolute;right:13px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:3;
    display:flex;flex-direction:column;gap:9px}
  .tool{width:46px;height:46px;border-radius:16px;border:1px solid rgba(160,180,255,.18);
    background:rgba(16,20,45,.82);backdrop-filter:blur(10px);display:grid;place-items:center;cursor:pointer;
    color:var(--paper);font-size:18px;font-weight:700;transition:transform .16s,background .2s}
  .tool:active{transform:scale(.9)}
  .tool.on{background:linear-gradient(140deg,var(--kia),#ff9a6b);color:#0a0c1b;box-shadow:0 0 22px rgba(255,95,141,.55)}
  .detail{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:16px 14px calc(100px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,transparent,rgba(7,9,18,.94) 26%);transform:translateY(106%);
    transition:transform .36s cubic-bezier(.2,.9,.2,1);pointer-events:none}
  .detail.on{transform:translateY(0);pointer-events:auto}
  .dcard{max-width:560px;margin:0 auto;border:1px solid rgba(160,180,255,.2);border-radius:24px;padding:16px;
    background:linear-gradient(165deg,rgba(34,40,92,.97),rgba(13,16,40,.97));
    box-shadow:0 -18px 60px -22px rgba(255,95,141,.6)}
  @keyframes grow{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
  @keyframes flow{to{stroke-dashoffset:-40}}
  @keyframes pop{0%{transform:scale(.1);opacity:0}62%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes halo{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.09)}}
  @keyframes ripple{from{r:26;opacity:.85}to{r:78;opacity:0}}
  .tnode{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,.9,.3,1.4) both}
  .tnode .halo{transform-box:fill-box;transform-origin:center;animation:halo 3.4s ease-in-out infinite}
  .bobwrap{transform-box:fill-box;transform-origin:center;animation:bob 4.6s ease-in-out infinite}
  .tlink{stroke-dasharray:var(--len);animation:grow 1s ease forwards}
  .tflow{animation:flow 1.6s linear infinite}
  .tnode .ring{transition:stroke-width .2s}
  .sel .ring{stroke:#fff;stroke-width:3.5}
  .genband{font-family:"Bricolage Grotesque",serif;font-size:60px;fill:rgba(160,180,255,.07);font-weight:800}
  .nameplate{fill:rgba(7,9,18,.72);stroke:rgba(160,180,255,.16)}
  .legend{position:absolute;left:14px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:3;
    display:flex;flex-direction:column;gap:6px;font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--mist);
    background:rgba(16,20,45,.7);backdrop-filter:blur(8px);padding:9px 11px;border-radius:13px;border:1px solid rgba(160,180,255,.14)}
  .legend i{display:inline-block;width:16px;height:2px;vertical-align:middle;margin-right:6px;border-radius:2px}

/* ============ data ============ */
function blank(){return{ms:{},vax:{},goals:[],growth:[]};}
function bd(id){DB.baby[id]=DB.baby[id]||blank();return DB.baby[id];}
const grp=(rows,key)=>{const o={};(rows||[]).forEach(r=>{(o[r[key]]=o[r[key]]||[]).push(r);});return o;};
async function pull(){
  const q=t=>sb.from(t).select("*");
  const[mem,ms,vx,gr,go,ev,hr,dl,mp,ph,vt,lb,ct,pf,an]=await Promise.all(
    ["members","milestones","vaccines","growth","goals","events","health_records","daily_logs","mpasi","photos",
     "vitals","labs","contacts","prefs","ancestors"].map(q));
  if(mem.error)throw mem.error;
  const next={family:mem.data||[],baby:{},events:ev.data||[],
    health:grp(hr.data,"member_id"),logs:grp(dl.data,"member_id"),
    mpasi:grp(mp.data,"member_id"),photos:grp(ph.data,"member_id"),
    vitals:grp(vt.data,"member_id"),labs:grp(lb.data,"member_id"),
    contacts:grp(ct.data,"member_id"),prefs:grp(pf.data,"member_id"),
    ancestors:(an.data||[]).sort((a,b)=>a.generasi-b.generasi||a.urutan-b.urutan)};
  (mem.data||[]).forEach(m=>next.baby[m.id]=blank());
  const B=id=>(next.baby[id]=next.baby[id]||blank());
  (ms.data||[]).forEach(r=>B(r.member_id).ms[r.key]=r.achieved_on);
  (vx.data||[]).forEach(r=>B(r.member_id).vax[r.key]=r.given_on);
  (gr.data||[]).forEach(r=>B(r.member_id).growth.push(r));
  (go.data||[]).forEach(r=>B(r.member_id).goals.push(r));
  DB=next;
  try{localStorage.setItem(CACHE,JSON.stringify(DB));}catch(e){}
}
async function start(session){
  me=session.user;
  $("#gate").style.display="none";$("#nav").classList.add("on");
  const c=localStorage.getItem(CACHE);
  if(c){try{DB={...DB,...JSON.parse(c)};}catch(e){}}
  render();
  try{
    await pull();
    const{data}=await sb.from("allowed_emails").select("email").limit(1);
    if(!data||!data.length){
      $("#gate").style.display="grid";$("#nav").classList.remove("on");
      $("#gateBody").innerHTML=`<div class="card" style="margin-top:14px"><b>Akun belum diizinkan</b>
        <p class="note" style="margin-top:6px">ID ini berhasil masuk tapi belum terdaftar sebagai anggota keluarga.</p></div>
        <button class="btn btn-ghost" style="width:100%;margin-top:12px" onclick="signOut()">Keluar</button>`;
      return;}
    render();
  }catch(e){toast("Gagal memuat dari server. Menampilkan salinan terakhir.");}
  sb.channel("kel").on("postgres_changes",{event:"*",schema:"public"},()=>{
    clearTimeout(window._rt);window._rt=setTimeout(()=>pull().then(render).catch(()=>{}),700);
  }).subscribe();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull().then(render).catch(()=>{});});
}
async function tx(fn,msg){try{const{error}=await fn();if(error)throw error;await pull();render();if(msg)toast(msg);}catch(e){fail(e);}}

function ribbon(id,am){

  let ticks="";for(let i=0;i<=MAX;i++)ticks+=`<div class="tick" style="left:${i/MAX*100}%"></div>`;
  const nowFlag=flags.find(f=>f>am)||24;
  const fl=flags.map(f=>{const full=doneCount(id,f)===totalCount(f);
    return `<div class="flag ${f===nowFlag?"now":(am>=f&&full?"done":"")}" style="left:${f/MAX*100}%">${f}<i></i></div>`;}).join("");
  return `<div class="ribbon"><div class="ribbon-track">${ticks}<div class="ribbon-line"></div>
    <div class="ribbon-fill" style="width:${Math.min(am/MAX,1)*100}%"></div>${fl}</div>
    <div class="ribbon-cap"><span>LAHIR</span><span>PEMERIKSAAN BULAN KE-</span><span>2 TAHUN</span></div></div>`;
}
function whoChart(g,b,sex){
  const isW=curveMode==="berat";
  const T=isW?WFA[sex==="P"?"P":"L"]:LFA[sex==="P"?"P":"L"];
  const pts=g.filter(x=>isW?x.berat:x.tinggi).map(x=>({
    x:daysBetween(b,parse(x.tanggal))/30.4375, y:+(isW?x.berat:x.tinggi)}));
  const W=340,H=190,PL=30,PB=22,PT=10;
  const xMax=Math.max(6,Math.min(24,Math.ceil((pts.length?Math.max(...pts.map(p=>p.x)):3)+3)));
  const band=[];
  for(let mo=0;mo<=xMax;mo++){
    let lo,hi,md;
    if(isW){const[L,M,S]=T[mo];lo=M*Math.pow(1+L*S*-2,1/L);hi=M*Math.pow(1+L*S*2,1/L);md=M;}
    else{const[M,SD]=T[mo];lo=M-2*SD;hi=M+2*SD;md=M;}
    band.push({mo,lo,hi,md});
  }
  const yLo=Math.min(...band.map(p=>p.lo),...pts.map(p=>p.y))*.94;
  const yHi=Math.max(...band.map(p=>p.hi),...pts.map(p=>p.y))*1.04;
  const X=v=>PL+v/xMax*(W-PL-8), Y=v=>H-PB-(v-yLo)/((yHi-yLo)||1)*(H-PB-PT);
  const up=band.map((p,i)=>`${i?"L":"M"}${X(p.mo).toFixed(1)},${Y(p.hi).toFixed(1)}`).join(" ");
  const dn=band.slice().reverse().map(p=>`L${X(p.mo).toFixed(1)},${Y(p.lo).toFixed(1)}`).join(" ");
  const med=band.map((p,i)=>`${i?"L":"M"}${X(p.mo).toFixed(1)},${Y(p.md).toFixed(1)}`).join(" ");
  const line=pts.map((p,i)=>`${i?"L":"M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const unit=isW?"kg":"cm";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kurva pertumbuhan WHO">
    <defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c8cff" stop-opacity=".16"/><stop offset="1" stop-color="#7c8cff" stop-opacity=".05"/></linearGradient></defs>
    <path d="${up} ${dn} Z" fill="url(#bg1)" stroke="rgba(124,140,255,.35)" stroke-width="1"/>
    <path d="${med}" fill="none" stroke="rgba(152,160,212,.5)" stroke-width="1" stroke-dasharray="3 3"/>
    ${pts.length?`<path d="${line}" fill="none" stroke="#ff5f8d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 6px rgba(255,95,141,.7))"/>`:""}
    ${pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.4" fill="#0a0c1b" stroke="#ff5f8d" stroke-width="2"/>`).join("")}
    <text class="glabel" x="${PL}" y="${H-6}">0 bln</text>
    <text class="glabel" x="${W-8}" y="${H-6}" text-anchor="end">${xMax} bln</text>
    <text class="glabel" x="3" y="${PT+9}">${yHi.toFixed(0)} ${unit}</text>
    <text class="glabel" x="3" y="${H-PB}">${yLo.toFixed(0)} ${unit}</text>
    ${!pts.length?`<text class="glabel" x="${W/2}" y="${H/2}" text-anchor="middle" style="font-size:11px">Belum ada data — catat pengukuran pertama</text>`:""}
  </svg>`;
}

/* ============ PANGGUNG POHON KELUARGA ============ */
const T={x:0,y:0,k:1,nodes:[],links:[],sel:null,shio:false,wind:1,raf:0,leaves:[]};

function treeBuild(){
  const fam=DB.family;
  const kidsOf=id=>fam.filter(m=>m.ayah_id===id||m.ibu_id===id);
  const depth={},seen=new Set();
  const roots=fam.filter(m=>!m.ayah_id&&!m.ibu_id)
    .sort((a,b)=>(a.generasi||99)-(b.generasi||99)||String(a.tanggal).localeCompare(String(b.tanggal)));
  (function walk(list,d){
    list.forEach(m=>{
      if(seen.has(m.id))return;seen.add(m.id);depth[m.id]=d;
      const sp=m.pasangan_id?fam.find(x=>x.id===m.pasangan_id):null;
      if(sp&&!seen.has(sp.id)){seen.add(sp.id);depth[sp.id]=d;}
      const kids=[...kidsOf(m.id),...(sp?kidsOf(sp.id):[])]
        .filter((v,i,a)=>a.findIndex(y=>y.id===v.id)===i);
      walk(kids,d+1);
    });
  })(roots,0);
  fam.forEach(m=>{if(depth[m.id]==null)depth[m.id]=(m.generasi?m.generasi-21:0);});

  const byD={};fam.forEach(m=>{(byD[depth[m.id]]=byD[depth[m.id]]||[]).push(m);});
  const GAP=138,ROW=142,nodes=[],pos={};
  Object.keys(byD).map(Number).sort((a,b)=>a-b).forEach(d=>{
    const row=byD[d];
    // pasangan berdampingan
    row.sort((a,b)=>{
      const ka=a.pasangan_id&&row.find(x=>x.id===a.pasangan_id)?Math.min(a.id,a.pasangan_id):a.id;
      const kb=b.pasangan_id&&row.find(x=>x.id===b.pasangan_id)?Math.min(b.id,b.pasangan_id):b.id;
      return ka<kb?-1:ka>kb?1:0;});
    const w=(row.length-1)*GAP;
    row.forEach((m,i)=>{
      const p={m,x:i*GAP-w/2,y:d*ROW,d,ph:Math.random()*6.283};
      pos[m.id]=p;nodes.push(p);
    });
  });
  const links=[];
  fam.forEach(m=>{
    ["ayah_id","ibu_id"].forEach(k=>{
      if(m[k]&&pos[m[k]]&&pos[m.id])links.push({a:pos[m[k]],b:pos[m.id],t:"anak"});});
    if(m.pasangan_id&&pos[m.pasangan_id]&&pos[m.id]&&m.id<m.pasangan_id)
      links.push({a:pos[m.id],b:pos[m.pasangan_id],t:"nikah"});
  });
  T.nodes=nodes;T.links=links;
}

function treeSVG(){
  const svg=document.getElementById("tsvg");if(!svg)return;
  const N=T.nodes,L=T.links;
  if(!N.length){svg.innerHTML=`<text x="50%" y="46%" text-anchor="middle" fill="#98a0d4" font-size="14">Belum ada profil</text>`;
    document.getElementById("tSub").textContent="";return;}
  const HUE=[["#ff5f8d","#ff9a6b"],["#7c8cff","#5ec8e0"],["#39e6b0","#7cf0d0"],["#ffc247","#ff9a6b"],["#c98bf0","#7c8cff"]];
  const defs=[];
  N.forEach((p,i)=>{
    const h=HUE[p.d%HUE.length];
    defs.push(`<radialGradient id="ng${i}" cx="35%" cy="28%">
      <stop offset="0" stop-color="${h[1]}"/><stop offset="1" stop-color="${h[0]}"/></radialGradient>`);

      defs.push(`<clipPath id="cp${i}"><circle cx="0" cy="0" r="27"/></clipPath>`);
  });
  // pita generasi + karakter 字辈
  const gens=[...new Set(N.map(p=>p.d))].sort((a,b)=>a-b);
  const minX=Math.min(...N.map(p=>p.x));
  const bands=gens.map(d=>{
    const g=N.find(p=>p.d===d),ch=(YU_POEM.find(y=>y[0]===(g.m.generasi||0))||[])[1]||"";
    return `<text class="genband" x="${minX-150}" y="${d*142+22}">${ch}</text>`;}).join("");
  const linkEl=L.map((l,i)=>{
    const d=linkPath(l),len=l.t==="nikah"?Math.abs(l.b.x-l.a.x)+2:Math.abs(l.b.y-l.a.y)+140;
    return `<path class="tlink ${l.t==="anak"?"":""}" data-l="${i}" d="${d}" fill="none"
      stroke="${l.t==="nikah"?"#ff5f8d":"url(#lg)"}" stroke-width="${l.t==="nikah"?2.4:3}"
      stroke-linecap="round" ${l.t==="nikah"?'stroke-dasharray="7 6"':""}
      style="--len:${len};animation-delay:${(l.a.d*.14+i*.02).toFixed(2)}s;opacity:.95"/>`;}).join("");
  const flowEl=L.filter(l=>l.t==="anak").map((l,i)=>
    `<path class="tflow" data-lf="${L.indexOf(l)}" d="${linkPath(l)}" fill="none" stroke="#fff" stroke-width="1.6"
      stroke-linecap="round" stroke-dasharray="2 38" opacity=".55"/>`).join("");
  const nodeEl=N.map((p,i)=>{
    const m=p.m,g=T.shio?ganzhi(parse(m.tanggal)):null,a=ageParts(m.tanggal);
    const h=HUE[p.d%HUE.length];
    const img=m.avatar_path&&signed[m.avatar_path]
      ?`<image href="${signed[m.avatar_path]}" x="-27" y="-27" width="54" height="54"
          preserveAspectRatio="xMidYMid slice" clip-path="url(#cp${i})" onerror="this.remove()"/>`
      :`<text y="9" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800"
          font-size="24" fill="rgba(7,9,18,.85)">${esc((m.nama.trim()[0]||"?").toUpperCase())}</text>`;
    const born=nextBirthday(m.tanggal),bd=born&&born.days===0;
    const nm=(m.nama||"").split(" ")[0],sub=g?g.shio:(a?(a.y>0?a.y+" th":a.totalMonths+" bln"):"");
    const w=Math.max(nm.length*7.6+18,54);
    return `<g transform="translate(${p.x},${p.y})" data-id="${m.id}" data-i="${i}" style="cursor:grab">
      <g class="tnode ${T.sel===m.id?"sel":""}" style="animation-delay:${(p.d*.14+i*.05).toFixed(2)}s">
       <g class="bobwrap" style="animation-delay:${(i*.3).toFixed(1)}s">
        <circle class="halo" r="40" fill="${h[0]}" opacity=".28"/>
        ${bd?`<circle r="34" fill="none" stroke="#ffc247" stroke-width="2.5">
          <animate attributeName="r" values="30;48;30" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".95;0;.95" dur="2.2s" repeatCount="indefinite"/></circle>`:""}
        <circle r="30" fill="none" stroke="${h[0]}" stroke-width="1.2" opacity=".5" stroke-dasharray="3 6">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="${18+i*3}s" repeatCount="indefinite"/></circle>
        <circle class="ring" r="27" fill="${m.avatar_path&&signed[m.avatar_path]?"#151a3c":`url(#ng${i})`}"
          stroke="${m.wafat?"rgba(152,160,212,.7)":h[1]}" stroke-width="2"/>
        ${img}
        <rect class="nameplate" x="${-w/2}" y="38" width="${w}" height="21" rx="10"/>
        <text y="52.5" text-anchor="middle" font-size="12" font-weight="600" fill="#eef1ff">${esc(nm)}</text>
        <text y="72" text-anchor="middle" font-size="10" fill="${h[1]}" font-family="JetBrains Mono,monospace">${esc(sub)}</text>
       </g>
      </g></g>`;}).join("");
  svg.innerHTML=`<defs>${defs.join("")}
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5f8d"/><stop offset="1" stop-color="#7c8cff"/></linearGradient>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g id="tworld"><g id="tbands">${bands}</g>
      <g id="tlinks" filter="url(#gl)">${linkEl}${flowEl}</g>
      <g id="tnodes">${nodeEl}</g></g>`;
  bindNodes();
  treeApply();
  document.getElementById("tSub").textContent=`${N.length} orang · ${gens.length} generasi · tahan untuk geser, cubit untuk zoom`;
}
function linkPath(l){
  return l.t==="nikah"
    ? `M${l.a.x},${l.a.y} L${l.b.x},${l.b.y}`
    : `M${l.a.x},${l.a.y+34} C${l.a.x},${l.a.y+92} ${l.b.x},${l.b.y-92} ${l.b.x},${l.b.y-34}`;
}
function redrawLinks(){
  const g=document.getElementById("tlinks");if(!g)return;
  g.querySelectorAll("[data-l]").forEach(p=>{
    const l=T.links[+p.getAttribute("data-l")];if(l)p.setAttribute("d",linkPath(l));});
  g.querySelectorAll("[data-lf]").forEach(p=>{
    const l=T.links[+p.getAttribute("data-lf")];if(l)p.setAttribute("d",linkPath(l));});
}
function bindNodes(){
  document.querySelectorAll("#tnodes [data-id]").forEach(el=>{
    let sx,sy,ox,oy,drag=false,t0=0,pid=null;
    const p=T.nodes[+el.getAttribute("data-i")];
    el.addEventListener("pointerdown",e=>{
      e.stopPropagation();pid=e.pointerId;t0=Date.now();drag=false;
      sx=e.clientX;sy=e.clientY;ox=p.x;oy=p.y;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointermove",e=>{
      if(pid!==e.pointerId)return;
      const dx=(e.clientX-sx)/T.k,dy=(e.clientY-sy)/T.k;
      if(!drag&&Math.hypot(dx,dy)*T.k>7)drag=true;
      if(drag){e.stopPropagation();p.x=ox+dx;p.y=oy+dy;
        el.setAttribute("transform",`translate(${p.x},${p.y})`);redrawLinks();}
    });
    el.addEventListener("pointerup",e=>{
      if(pid!==e.pointerId)return;pid=null;
      if(!drag&&Date.now()-t0<420){ripple(p);treeSelect(el.getAttribute("data-id"));}
    });
    el.addEventListener("pointercancel",()=>{pid=null;});
  });
}
function ripple(p){
  const g=document.getElementById("tnodes");if(!g)return;
  const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("cx",p.x);c.setAttribute("cy",p.y);c.setAttribute("r",26);
  c.setAttribute("fill","none");c.setAttribute("stroke","#fff");c.setAttribute("stroke-width","2");
  c.style.animation="ripple .65s ease-out forwards";
  g.appendChild(c);setTimeout(()=>c.remove(),700);
  if(navigator.vibrate)navigator.vibrate(12);
}
function treeApply(){
  const w=document.getElementById("tworld");

}
window.treeFit=function(){

  const r=svg.getBoundingClientRect();
  const xs=T.nodes.map(p=>p.x),ys=T.nodes.map(p=>p.y);
  const x0=Math.min(...xs)-80,x1=Math.max(...xs)+80,y0=Math.min(...ys)-80,y1=Math.max(...ys)+110;
  const k=Math.min(r.width/(x1-x0),(r.height-230)/(y1-y0),1.2);
  animateTo(r.width/2-((x0+x1)/2)*Math.max(.25,k),(r.height-30)/2-((y0+y1)/2)*Math.max(.25,k),Math.max(.25,k));
};

      ${g?`<span class="pill k">${g.shio}</span><span class="pill j">${g.yin} ${g.elemen}</span>`:""}
      ${zb?`<span class="pill" style="color:var(--iris);border-color:rgba(124,140,255,.4)">${zb}</span>`:""}
      ${nb?`<span class="pill ${nb.days===0?"g":""}">${nb.days===0?"ULANG TAHUN HARI INI":nb.days+" hari lagi"}</span>`:""}
    </div>
    <div class="note" style="margin-top:10px">
      ${ay?`Ayah <b style="color:var(--paper)">${esc(ay.nama)}</b>`:""}${ay&&ib?" · ":""}${ib?`Ibu <b style="color:var(--paper)">${esc(ib.nama)}</b>`:""}
      ${sp?`${(ay||ib)?"<br>":""}Pasangan <b style="color:var(--paper)">${esc(sp.nama)}</b>`:""}
      ${kids.length?`<br>Anak: ${kids.map(k=>esc(k.nama)).join(", ")}`:""}
      ${!ay&&!ib&&!sp&&!kids.length?"Belum ada hubungan keluarga yang diisi.":""}
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeStage();editMember('${m.id}')">Buka profil</button>
      ${kids.length?`<button class="btn btn-primary" style="flex:1" onclick="treeFocus('${kids[0].id}')">Turun ke anak</button>`
        :ay?`<button class="btn btn-primary" style="flex:1" onclick="treeFocus('${ay.id}')">Naik ke ayah</button>`:""}
    </div>`;
  document.getElementById("tDetail").classList.add("on");
};
window.closeDetail=function(){document.getElementById("tDetail").classList.remove("on");
  T.sel=null;document.querySelectorAll("#tsvg .tnode").forEach(e=>e.classList.remove("sel"));};
window.treeFocus=function(id){
  const p=T.nodes.find(n=>n.m.id===id);if(!p)return;
  treeSelect(id);ripple(p);
  const svg=document.getElementById("tsvg"),r=svg.getBoundingClientRect();
  const k=Math.max(T.k,.9);
  animateTo(r.width/2-p.x*k,r.height*.34-p.y*k,k);
};
function animateTo(x,y,k){
  const sx=T.x,sy=T.y,sk=T.k,t0=performance.now();
  cancelAnimationFrame(T.raf);
  (function step(t){
    const u=Math.min(1,(t-t0)/500),e=1-Math.pow(1-u,3);
    T.x=sx+(x-sx)*e;T.y=sy+(y-sy)*e;T.k=sk+(k-sk)*e;treeApply();
    if(u<1)T.raf=requestAnimationFrame(step);
  })(t0);
}
window.treeShuffleWind=function(){
  T.wind=T.wind===1?2.8:1;
  for(let i=0;i<26;i++)T.leaves.push(newLeaf(true));
  toast(T.wind>1?"Angin bertiup":"Angin reda");
};
function newLeaf(burst){
  const c=document.getElementById("sky"),W=c?c.width:400;
  return{x:Math.random()*W,y:burst?-20-Math.random()*300:-20,
    vy:.3+Math.random()*.6,vx:(Math.random()-.5)*.4,r:2+Math.random()*3.6,
    a:.3+Math.random()*.45,hue:["255,95,141","124,140,255","57,230,176","255,194,71"][(Math.random()*4)|0],sp:Math.random()*6.283};
}
let STARS=[];
function skyLoop(){
  const c=document.getElementById("sky");
  if(!c||!document.getElementById("stage").classList.contains("on"))return;
  const x=c.getContext("2d"),dp=Math.min(devicePixelRatio||1,2);
  if(c.width!==c.clientWidth*dp||c.height!==c.clientHeight*dp){
    c.width=c.clientWidth*dp;c.height=c.clientHeight*dp;
    STARS=Array.from({length:70},()=>({x:Math.random()*c.width,y:Math.random()*c.height,
      r:(Math.random()*1.3+.3)*dp,p:Math.random()*6.283,s:.4+Math.random()}));}
  // langit bergradien: dijamin gelap apa pun tema peramban
  const gr=x.createRadialGradient(c.width*.5,0,0,c.width*.5,0,c.height*1.15);
  gr.addColorStop(0,"#221a4a");gr.addColorStop(.45,"#131736");gr.addColorStop(1,"#070912");
  x.fillStyle=gr;x.fillRect(0,0,c.width,c.height);
  const t=performance.now()/1000;
  STARS.forEach(st=>{const tw=.35+.65*Math.abs(Math.sin(t*st.s+st.p));
    x.beginPath();x.fillStyle=`rgba(200,215,255,${(.5*tw).toFixed(2)})`;
    x.arc(st.x,st.y,st.r,0,6.283);x.fill();});
  if(T.leaves.length<38)T.leaves.push(newLeaf());
  T.leaves=T.leaves.filter(l=>l.y<c.height+40);
  T.leaves.forEach(l=>{
    l.sp+=.02;l.y+=l.vy*T.wind*dp;l.x+=(l.vx*T.wind+Math.sin(l.sp)*.45)*dp;
    x.beginPath();x.fillStyle=`rgba(${l.hue},${l.a})`;
    x.ellipse(l.x,l.y,l.r*dp,l.r*1.8*dp,l.sp,0,6.283);x.fill();});
  requestAnimationFrame(skyLoop);
}
